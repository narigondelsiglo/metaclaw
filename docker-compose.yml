services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
    depends_on:
      searxng:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # lan = bind to all interfaces inside the container; the host-side port
      # is still locked to 127.0.0.1 via the ports mapping above.
      OPENCLAW_GATEWAY_BIND: lan
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist OpenClaw state across container restarts
      - openclaw-home:/home/node/.openclaw
      # Mount our skill into the shared skills directory
      - ./skills/metaclaw-setup-architect:/home/node/.openclaw/skills/metaclaw-setup-architect:ro
      # Mount test workspace (for running tests)
      - ./test/workspace:/home/node/.openclaw/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Self-hosted SearXNG — zero-key web search (internal only, no exposed ports)
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Fail fast if SEARXNG_SECRET_KEY is missing or empty — env_file alone
      # would silently pass an empty string, which is a security risk.
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:?Set SEARXNG_SECRET_KEY in .env (run: openssl rand -hex 32)}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    network_mode: "service:openclaw-gateway"
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    volumes:
      - openclaw-home:/home/node/.openclaw
      - ./skills/metaclaw-setup-architect:/home/node/.openclaw/skills/metaclaw-setup-architect:ro
      - ./test/workspace:/home/node/.openclaw/workspace
    env_file:
      - .env
    entrypoint: ["node", "dist/index.js"]
    profiles:
      - cli

volumes:
  openclaw-home:
